version: '3.8'

services:
  # ============================================================================
  # 1. MICROSERVICIO DE BASE DE DATOS (Data Warehouse)
  # ============================================================================
  database:
    image: postgres:15-alpine
    container_name: navoptima_db
    restart: always
    environment:
      POSTGRES_USER: nav_user
      POSTGRES_PASSWORD: nav_password
      POSTGRES_DB: navoptima_warehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Apunta al script SQL que creamos antes
      - ../docs/design/005-gold-schema-ddl.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nav_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nav_user -d navoptima_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. MICROSERVICIO WORKER (ETL / Ingesta)
  # ============================================================================
  ingestion_worker:
    build:
      context: ..
      dockerfile: orchestration/Dockerfile
    container_name: navoptima_worker
    environment:
      - DB_USER=nav_user
      - DB_PASS=nav_password
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=navoptima_warehouse
    volumes:
      - ../src:/app/src
      - ../data:/app/data
    depends_on:
      database:
        condition: service_healthy
    command: tail -f /dev/null
    networks:
      - nav_network

  # ============================================================================
  # 3. MICROSERVICIO API (ML Serving / Inferencia)
  # ============================================================================
  inference_api:
    build:
      context: ..
      dockerfile: orchestration/Dockerfile
    container_name: navoptima_api
    ports:
      - "8000:8000"
    environment:
      - DB_USER=nav_user
      - DB_PASS=nav_password
      - DB_HOST=database
      - DB_NAME=navoptima_warehouse
    volumes:
      - ../src:/app/src
      - ../models:/app/models
    depends_on:
      database:
        condition: service_healthy
    command: uvicorn src.ml_engine.serving.api:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - nav_network

networks:
  nav_network:
    driver: bridge

volumes:
  postgres_data: